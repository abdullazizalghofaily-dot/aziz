<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutriziz — Procurement</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script>
(function(){
  var saved = localStorage.getItem('nutriziz-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eeece3;--surface:#f6f5ef;--surface2:#e7e5da;
  --border:#c9cfbd;--border-light:#d6dac8;
  --accent:#2f6f4e;--accent2:#c8703a;
  --text:#1e2a22;--text2:#4a5647;--muted:#7c8577;--faint:#a8a296;
  --red:#c94040;--red-bg:#fdf0f0;--red-border:#f0c0c0;
  --amber:#c47a00;--amber-bg:#fdf6e3;--amber-border:#f0dca0;
  --green:#1e8a54;--green-bg:#edfaf3;--green-border:#b0e8cc;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sh-lg:-16px 0 40px rgba(30,42,34,.16)
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11160e;--surface:#171d13;--surface2:#1b2216;
    --border:#2c3524;--border-light:#232b1c;
    --accent:#6fbf8f;--accent2:#e2955c;
    --text:#eaf0e4;--text2:#b7c0ac;--muted:#818a72;--faint:#5b6350;
    --red:#e8837e;--red-bg:#2a1a19;--red-border:#4a2b29;
    --amber:#e6ac4c;--amber-bg:#2a2417;--amber-border:#4a3e28;
    --green:#5fd097;--green-bg:#182920;--green-border:#274a37;
    --sh-lg:-16px 0 40px rgba(0,0,0,.45)
  }
}
:root[data-theme="dark"]{
  --bg:#11160e;--surface:#171d13;--surface2:#1b2216;
  --border:#2c3524;--border-light:#232b1c;
  --accent:#6fbf8f;--accent2:#e2955c;
  --text:#eaf0e4;--text2:#b7c0ac;--muted:#818a72;--faint:#5b6350;
  --red:#e8837e;--red-bg:#2a1a19;--red-border:#4a2b29;
  --amber:#e6ac4c;--amber-bg:#2a2417;--amber-border:#4a3e28;
  --green:#5fd097;--green-bg:#182920;--green-border:#274a37;
  --sh-lg:-16px 0 40px rgba(0,0,0,.45)
}
:root[data-theme="light"]{
  --bg:#eeece3;--surface:#f6f5ef;--surface2:#e7e5da;
  --border:#c9cfbd;--border-light:#d6dac8;
  --accent:#2f6f4e;--accent2:#c8703a;
  --text:#1e2a22;--text2:#4a5647;--muted:#7c8577;--faint:#a8a296;
  --red:#c94040;--red-bg:#fdf0f0;--red-border:#f0c0c0;
  --amber:#c47a00;--amber-bg:#fdf6e3;--amber-border:#f0dca0;
  --green:#1e8a54;--green-bg:#edfaf3;--green-border:#b0e8cc;
  --sh-lg:-16px 0 40px rgba(30,42,34,.16)
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;transition:background .2s,color .2s;overflow-x:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
h1{font-size:1rem;font-weight:600}
h1 .i-accent{color:var(--accent)}
h1 .ziz{color:var(--accent2);font-weight:700}
button{font-family:var(--font);cursor:pointer}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-size:.78rem;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#theme-toggle{width:30px;height:30px;flex-shrink:0;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
#theme-toggle.floating{position:fixed;top:16px;right:16px;z-index:500}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
main{max-width:640px;margin:0 auto;padding:24px 24px 60px}
#auth-screen{max-width:380px;margin:80px auto;background:var(--surface);border:1px solid var(--border-light);border-radius:12px;padding:32px}
#auth-screen h2{font-size:1rem;font-weight:600;margin-bottom:20px;text-align:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.field input{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-family:var(--font);font-size:.8rem;background:var(--surface2);color:var(--text)}
.auth-error{color:var(--red);font-size:.78rem;margin-top:8px;text-align:center;display:none}
#denied-screen{max-width:420px;margin:100px auto;background:var(--surface);border:1px solid var(--border-light);border-radius:12px;padding:36px;text-align:center}
#denied-screen .icon{font-size:38px;margin-bottom:10px}
.hub-title{font-size:.85rem;color:var(--text2);margin-bottom:18px;text-align:center}
.hub-grid{display:flex;flex-direction:column;gap:14px}
.hub-card{display:flex;align-items:center;gap:16px;background:var(--surface);border:1px solid var(--border-light);border-radius:12px;padding:22px 24px;text-decoration:none;color:var(--text);transition:all .15s}
.hub-card:hover{border-color:var(--accent);background:var(--surface2)}
.hub-icon{font-size:2rem;flex-shrink:0}
.hub-name{font-size:1rem;font-weight:700}
.hub-desc{font-size:.76rem;color:var(--muted);margin-top:3px}
@media(max-width:640px){
  header{justify-content:center;text-align:center}
  header>div{justify-content:center}
}
</style>
</head>
<body>

<button id="theme-toggle" class="floating" type="button" aria-label="Toggle dark mode"></button>

<div id="auth-screen">
  <h2>📦 Procurement Portal</h2>
  <div class="field"><label>Email</label><input type="email" id="signin-email" autocomplete="username"></div>
  <div class="field"><label>Password</label><input type="password" id="signin-password" autocomplete="current-password"></div>
  <button class="btn btn-primary" id="signin-btn" style="width:100%">Sign In</button>
  <div class="auth-error" id="auth-error"></div>
</div>

<div id="denied-screen" style="display:none">
  <div class="icon">🚫</div>
  <h2>Not Authorized</h2>
  <p style="margin-top:10px;color:var(--text2);font-size:.85rem">This account doesn't have access to the Procurement Portal.</p>
  <button class="btn" id="denied-logout" style="margin-top:18px">Sign Out</button>
</div>

<div id="app-screen" style="display:none">
  <header>
    <h1>nutr<span class="i-accent">i</span><span class="ziz">ziz</span> · Procurement</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="theme-toggle-slot"></span>
      <span id="user-email" style="font-size:.78rem;color:var(--muted)"></span>
      <a class="btn" href="./index.html">View Site</a>
      <button class="btn" id="logout-btn">Sign Out</button>
    </div>
  </header>
  <main>
    <div class="hub-title">Choose a section</div>
    <div class="hub-grid">
      <a class="hub-card" href="./purchasing.html">
        <div class="hub-icon">🛒</div>
        <div>
          <div class="hub-name">Purchasing</div>
          <div class="hub-desc">Suppliers &amp; purchase orders — prices, quantities, order dates</div>
        </div>
      </a>
      <a class="hub-card" href="./warehouse.html">
        <div class="hub-icon">🏬</div>
        <div>
          <div class="hub-name">Warehouse</div>
          <div class="hub-desc">Stock levels, expiry dates, low-stock alerts</div>
        </div>
      </a>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

document.getElementById('signin-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('signin-email').value.trim();
  const password = document.getElementById('signin-password').value;
  const errEl = document.getElementById('auth-error');
  errEl.style.display = 'none';
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(e){
    errEl.textContent = 'Sign in failed: ' + e.message;
    errEl.style.display = 'block';
  }
});
document.getElementById('denied-logout').addEventListener('click', ()=>signOut(auth));
document.getElementById('logout-btn').addEventListener('click', ()=>signOut(auth));

function placeThemeToggle(inApp){
  const btn = document.getElementById('theme-toggle');
  if(inApp){
    document.getElementById('theme-toggle-slot').appendChild(btn);
    btn.classList.remove('floating');
  } else {
    document.body.insertBefore(btn, document.body.firstChild);
    btn.classList.add('floating');
  }
}

onAuthStateChanged(auth, async (user)=>{
  document.getElementById('auth-screen').style.display = 'none';
  document.getElementById('denied-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'none';
  if(!user){
    document.getElementById('auth-screen').style.display = 'block';
    placeThemeToggle(false);
    return;
  }
  const [adminSnap, staffSnap] = await Promise.all([
    getDoc(doc(db,'admins',user.uid)),
    getDoc(doc(db,'warehouseStaff',user.uid))
  ]);
  if(adminSnap.exists() || staffSnap.exists()){
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;
    placeThemeToggle(true);
  } else {
    document.getElementById('denied-screen').style.display = 'block';
    placeThemeToggle(false);
  }
});

function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function applyThemeIcon(){
  document.getElementById('theme-toggle').textContent = currentTheme()==='dark' ? '☀️' : '🌙';
}
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutriziz-theme', next);
  applyThemeIcon();
});
applyThemeIcon();
</script>
</body>
</html>
