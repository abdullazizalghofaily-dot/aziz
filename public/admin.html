<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutriziz — Admin</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script>
(function(){
  var saved = localStorage.getItem('nutriziz-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eeece3;--surface:#f6f5ef;--surface2:#e7e5da;
  --border:#c9cfbd;--border-light:#d6dac8;
  --accent:#2f6f4e;--accent2:#c8703a;
  --text:#1e2a22;--text2:#4a5647;--muted:#7c8577;--faint:#a8a296;
  --red:#c94040;--red-bg:#fdf0f0;--red-border:#f0c0c0;
  --amber:#c47a00;--amber-bg:#fdf6e3;--amber-border:#f0dca0;
  --green:#1e8a54;--green-bg:#edfaf3;--green-border:#b0e8cc;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sh-lg:-16px 0 40px rgba(30,42,34,.16)
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11160e;--surface:#171d13;--surface2:#1b2216;
    --border:#2c3524;--border-light:#232b1c;
    --accent:#6fbf8f;--accent2:#e2955c;
    --text:#eaf0e4;--text2:#b7c0ac;--muted:#818a72;--faint:#5b6350;
    --red:#e8837e;--red-bg:#2a1a19;--red-border:#4a2b29;
    --amber:#e6ac4c;--amber-bg:#2a2417;--amber-border:#4a3e28;
    --green:#5fd097;--green-bg:#182920;--green-border:#274a37;
    --sh-lg:-16px 0 40px rgba(0,0,0,.45)
  }
}
:root[data-theme="dark"]{
  --bg:#11160e;--surface:#171d13;--surface2:#1b2216;
  --border:#2c3524;--border-light:#232b1c;
  --accent:#6fbf8f;--accent2:#e2955c;
  --text:#eaf0e4;--text2:#b7c0ac;--muted:#818a72;--faint:#5b6350;
  --red:#e8837e;--red-bg:#2a1a19;--red-border:#4a2b29;
  --amber:#e6ac4c;--amber-bg:#2a2417;--amber-border:#4a3e28;
  --green:#5fd097;--green-bg:#182920;--green-border:#274a37;
  --sh-lg:-16px 0 40px rgba(0,0,0,.45)
}
:root[data-theme="light"]{
  --bg:#eeece3;--surface:#f6f5ef;--surface2:#e7e5da;
  --border:#c9cfbd;--border-light:#d6dac8;
  --accent:#2f6f4e;--accent2:#c8703a;
  --text:#1e2a22;--text2:#4a5647;--muted:#7c8577;--faint:#a8a296;
  --red:#c94040;--red-bg:#fdf0f0;--red-border:#f0c0c0;
  --amber:#c47a00;--amber-bg:#fdf6e3;--amber-border:#f0dca0;
  --green:#1e8a54;--green-bg:#edfaf3;--green-border:#b0e8cc;
  --sh-lg:-16px 0 40px rgba(30,42,34,.16)
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;transition:background .2s,color .2s;overflow-x:hidden}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;position:sticky;top:0;z-index:100}
h1{font-size:1rem;font-weight:600}
h1 .i-accent{color:var(--accent)}
h1 .ziz{color:var(--accent2);font-weight:700}
button{font-family:var(--font);cursor:pointer}
.btn{padding:7px 14px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-size:.78rem;font-weight:600}
.btn:hover{border-color:var(--accent);color:var(--accent)}
#theme-toggle{width:30px;height:30px;flex-shrink:0;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
#theme-toggle.floating{position:fixed;top:16px;right:16px;z-index:500}
.btn-primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent2);border-color:var(--accent2);color:#fff}
.btn-danger{background:none;border-color:var(--red-border);color:var(--red)}
.btn-danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
main{max-width:960px;margin:0 auto;padding:24px 24px 60px}
#login-screen{max-width:360px;margin:100px auto;background:var(--surface);border:1px solid var(--border-light);border-radius:12px;padding:32px}
#login-screen h2{font-size:1rem;font-weight:600;margin-bottom:20px;text-align:center}
.field{margin-bottom:12px}
.field label{display:block;font-size:.62rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;border:1px solid var(--border);border-radius:7px;font-family:var(--font);font-size:.8rem;background:var(--surface2);color:var(--text)}
.field textarea{min-height:70px;resize:vertical}
#login-error{color:var(--red);font-size:.78rem;margin-top:8px;text-align:center;display:none}
.toolbar{display:flex;gap:10px;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap}
#admin-search{flex:1;min-width:200px;padding:9px 14px;border:1px solid var(--border);border-radius:20px;background:var(--surface);font-family:var(--font);font-size:.8rem}
table{width:100%;border-collapse:collapse;border:1px solid var(--border-light)}
th,td{text-align:left;padding:11px 14px;font-size:.8rem;border-bottom:1px solid var(--border-light)}
th{background:var(--surface2);color:var(--text2);font-weight:600;text-transform:uppercase;font-size:.6rem;letter-spacing:.04em;font-family:var(--mono)}
tr:last-child td{border-bottom:none}
td.actions{display:flex;gap:6px;justify-content:flex-end}
.row-actions-cell{white-space:nowrap;text-align:right}
.tag{display:inline-block;font-size:.6rem;font-weight:600;padding:2px 7px;border-radius:4px;background:none;color:var(--red);border:1px solid var(--red-border);margin:1px;font-family:var(--mono)}
.show-more-wrap{text-align:center;padding:20px 0}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,25,20,.35);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;border-radius:12px;box-shadow:var(--sh-lg);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-header{padding:20px 22px 14px;border-bottom:1px solid var(--border-light);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--surface);border-radius:12px 12px 0 0}
.modal-title{font-size:.92rem;font-weight:700}
.modal-body{padding:18px 22px 30px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.checkbox-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:4px}
.checkbox-grid label{display:flex;align-items:center;gap:5px;font-size:.75rem;font-weight:500;color:var(--text2)}
.modal-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:16px}
.ing-search-results{position:absolute;top:100%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:0 8px 24px rgba(30,42,34,.12);max-height:220px;overflow-y:auto;z-index:50;display:none}
.ing-search-results.open{display:block}
.ing-result{padding:9px 12px;font-size:.8rem;cursor:pointer;border-bottom:1px solid var(--border-light)}
.ing-result:last-child{border-bottom:none}
.ing-result:hover{background:var(--surface2)}
.ing-qty-row{padding:10px 12px;background:var(--surface2);border-top:1px solid var(--border)}
.ing-qty-name{font-size:.78rem;font-weight:600;color:var(--text);margin-bottom:8px;line-height:1.35}
.ing-qty-controls{display:flex;gap:8px;align-items:center}
.ing-qty-row input{width:90px;padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-family:var(--font);font-size:.8rem;flex-shrink:0}
.ing-qty-row select{padding:7px 9px;border:1px solid var(--border);border-radius:6px;font-family:var(--font);font-size:.8rem;flex-shrink:0}
.ing-qty-row button{flex-shrink:0}
.ing-picker-list{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.ing-picker-row{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;background:var(--surface2);border-radius:6px;font-size:.78rem}
.ing-picker-row button{background:none;border:none;color:var(--red);font-size:.9rem;cursor:pointer;padding:0 4px}
.ing-picker-empty{font-size:.76rem;color:var(--muted);padding:6px 2px}
#status-msg{position:fixed;bottom:20px;right:20px;padding:10px 18px;border-radius:8px;font-size:.8rem;font-weight:600;box-shadow:0 8px 24px rgba(30,42,34,.16);display:none;z-index:2000}
#status-msg.ok{background:var(--green-bg);color:var(--green);border:1px solid var(--green-border)}
#status-msg.err{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
@media(max-width:640px){
  header{justify-content:center;text-align:center}
  header>div{justify-content:center}
}
</style>
</head>
<body>

<button id="theme-toggle" class="floating" type="button" aria-label="Toggle dark mode"></button>

<div id="login-screen">
  <h2>🔐 Admin Login</h2>
  <div class="field"><label>Email</label><input type="email" id="login-email" autocomplete="username"></div>
  <div class="field"><label>Password</label><input type="password" id="login-password" autocomplete="current-password"></div>
  <button class="btn btn-primary" id="login-btn" style="width:100%">Sign In</button>
  <div id="login-error"></div>
</div>

<div id="app-screen" style="display:none">
  <header>
    <h1>nutr<span class="i-accent">i</span><span class="ziz">ziz</span> · Admin</h1>
    <div style="display:flex;gap:10px;align-items:center">
      <span id="theme-toggle-slot"></span>
      <span id="user-email" style="font-size:.78rem;color:var(--muted)"></span>
      <a class="btn" href="./index.html">View Site</a>
      <button class="btn" id="logout-btn">Sign Out</button>
    </div>
  </header>
  <main>
    <div id="chef-requests-section" style="display:none;margin-bottom:22px">
      <div style="font-size:.85rem;font-weight:700;color:var(--text2);margin-bottom:8px">👨‍🍳 Pending Chef Requests</div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th></th></tr></thead>
        <tbody id="chef-requests-body"></tbody>
      </table>
    </div>
    <div class="toolbar">
      <input type="text" id="admin-search" placeholder="Search products…">
      <button class="btn btn-primary" id="add-btn">+ Add Product</button>
    </div>
    <table>
      <thead><tr><th>Name</th><th>Source</th><th>Kcal</th><th>Contains</th><th></th></tr></thead>
      <tbody id="table-body"></tbody>
    </table>
    <div class="show-more-wrap"><button class="btn" id="show-more-btn" style="display:none">Show more</button></div>
  </main>
</div>

<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-title" id="modal-title">Add Product</div>
      <button class="btn" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <div class="grid2">
        <div class="field"><label>Name *</label><input type="text" id="f-name"></div>
        <div class="field"><label>Source</label><select id="f-source"><option value="products">Product</option><option value="recipes">Recipe</option></select></div>
      </div>
      <div id="product-fields">
        <div class="grid2">
          <div class="field"><label>Kcal / 100g</label><input type="number" step="0.01" id="f-kcal"></div>
          <div class="field"><label>Brand</label><input type="text" id="f-brand"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Fat (g)</label><input type="number" step="0.01" id="f-fat"></div>
          <div class="field"><label>Protein (g)</label><input type="number" step="0.01" id="f-protein"></div>
        </div>
        <div class="grid2">
          <div class="field"><label>Carbs (g)</label><input type="number" step="0.01" id="f-carbs"></div>
          <div class="field"><label>Country</label><input type="text" id="f-country"></div>
        </div>
      </div>
      <div class="field" id="ingredients-product-field">
        <label>Ingredients (composition list)</label>
        <textarea id="f-ingredients"></textarea>
      </div>
      <div class="field" id="ingredients-recipe-field">
        <label>Ingredients (search the database and add with a quantity)</label>
        <div style="position:relative">
          <input type="text" id="ingredient-search" placeholder="Search e.g. mayonnaise, cheese, chicken..." autocomplete="off">
          <div id="ingredient-search-results" class="ing-search-results"></div>
        </div>
        <div id="ingredient-list" class="ing-picker-list"></div>
      </div>
      <div class="field"><label>Method (for recipes)</label><textarea id="f-method"></textarea></div>
      <div class="field"><label>Description</label><textarea id="f-description"></textarea></div>
      <div class="field"><label>Notes</label><textarea id="f-notes"></textarea></div>
      <div class="field"><label>Diet tags (comma separated, e.g. Vegan, Halal)</label><input type="text" id="f-diet"></div>
      <div id="allergen-checkboxes-fields">
        <div class="field">
          <label>Contains (allergens)</label>
          <div class="checkbox-grid" id="contains-grid"></div>
        </div>
        <div class="field">
          <label>May Contain (allergens)</label>
          <div class="checkbox-grid" id="may-grid"></div>
        </div>
      </div>
      <div class="field" id="allergen-auto-note" style="display:none">
        <label>Allergens</label>
        <div style="font-size:.78rem;color:var(--muted)">Calculated automatically from the ingredients you add above.</div>
        <div id="allergen-preview" style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px"></div>
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeModal()">Cancel</button>
        <button class="btn btn-primary" id="save-btn">Save</button>
      </div>
    </div>
  </div>
</div>

<div id="status-msg"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getFirestore, collection, getDocs, doc, setDoc, addDoc, deleteDoc, query, where, updateDoc, serverTimestamp
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);

async function bumpCatalogVersion(){
  try{ await setDoc(doc(db,'meta','catalog'), {updatedAt: serverTimestamp()}, {merge:true}); }
  catch(e){ console.error('Failed to bump catalog version', e); }
}

const ALLERGENS = ['Gluten','Tree nuts','Peanuts','Eggs','Milk','Fish','Crustaceans','Molluscs','Celery','Mustard','Sesame','Soya','Sulphites','Lupin'];
const PAGE = 30;

let DATA = [];
let filtered = [];
let shown = 0;
let editingId = null;
let currentIngredients = [];
let NAME_INDEX = new Map();

function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function scoreM(name,q){
  const n=norm(name),qn=norm(q);
  if(n.startsWith(qn))return 3;if(n.includes(qn))return 2;
  const w=qn.split(' ').filter(Boolean),h=w.filter(x=>n.includes(x));
  return h.length===w.length?1:h.length>0?.5:0;
}
const QTY_RE=/^(.*?)\s*-\s*[\d.,\/]+\s*(?:g|kg|ml|l)\s*$/i;
function resolveIngredientLine(line){
  const m=line.match(QTY_RE);
  const base=(m?m[1]:line).trim();
  const rec=NAME_INDEX.get(norm(base));
  return {text:line, contains:rec?.contains||[], may_contain:rec?.may_contain||[]};
}

function buildCheckboxGrid(container, prefix){
  container.innerHTML = ALLERGENS.map(a=>`<label><input type="checkbox" value="${a}" data-group="${prefix}">${a}</label>`).join('');
}
buildCheckboxGrid(document.getElementById('contains-grid'),'contains');
buildCheckboxGrid(document.getElementById('may-grid'),'may');

function showStatus(msg, ok=true){
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
  el.style.display = 'block';
  setTimeout(()=>{el.style.display='none';}, 2500);
}

async function loadData(){
  document.getElementById('table-body').innerHTML = '<tr><td colspan="5">Loading…</td></tr>';
  const snap = await getDocs(collection(db,'products'));
  DATA = snap.docs.map(d=>({id:d.id, ...d.data()}));
  NAME_INDEX = new Map();
  DATA.forEach(rec=>{
    const k=norm(rec.name||'');
    if(!NAME_INDEX.has(k)) NAME_INDEX.set(k, rec);
  });
  applyFilter();
}

async function loadChefRequests(){
  const q = query(collection(db,'chefs'), where('status','==','pending'));
  const snap = await getDocs(q);
  const section = document.getElementById('chef-requests-section');
  const tbody = document.getElementById('chef-requests-body');
  if(snap.empty){
    section.style.display = 'none';
    return;
  }
  section.style.display = 'block';
  tbody.innerHTML = snap.docs.map(d=>{
    const c = d.data();
    return `<tr data-uid="${d.id}">
      <td>${c.name||''}</td>
      <td>${c.email||''}</td>
      <td class="row-actions-cell">
        <button class="btn btn-primary" data-action="approve" data-uid="${d.id}">Approve</button>
        <button class="btn btn-danger" data-action="reject" data-uid="${d.id}">Reject</button>
      </td>
    </tr>`;
  }).join('');
}
document.getElementById('chef-requests-body').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const uid = btn.dataset.uid;
  const status = btn.dataset.action==='approve' ? 'approved' : 'rejected';
  try{
    await updateDoc(doc(db,'chefs',uid), {status});
    showStatus(status==='approved' ? 'Chef approved' : 'Chef rejected');
    await loadChefRequests();
  }catch(err){
    showStatus('Action failed: '+err.message, false);
  }
});

function applyFilter(){
  const q = document.getElementById('admin-search').value.trim().toLowerCase();
  filtered = q ? DATA.filter(x=>x.name && x.name.toLowerCase().includes(q)) : DATA;
  shown = 0;
  renderTable(true);
}

function renderTable(reset){
  const tbody = document.getElementById('table-body');
  if(reset){ tbody.innerHTML=''; }
  const chunk = filtered.slice(shown, shown+PAGE);
  shown += chunk.length;
  if(filtered.length===0){
    tbody.innerHTML = '<tr><td colspan="5">No products found</td></tr>';
  } else {
    tbody.insertAdjacentHTML('beforeend', chunk.map(r=>`
      <tr data-id="${r.id}">
        <td>${r.name||''}</td>
        <td style="font-family:var(--mono);color:var(--muted);font-size:.72rem">${r.source||''}</td>
        <td style="font-family:var(--mono)">${r.kcal!=null?r.kcal:'—'}</td>
        <td>${(r.contains||[]).map(a=>`<span class="tag">${a}</span>`).join('')}</td>
        <td class="row-actions-cell">
          <button class="btn" data-action="edit" data-id="${r.id}">Edit</button>
          <button class="btn btn-danger" data-action="delete" data-id="${r.id}">Delete</button>
        </td>
      </tr>`).join(''));
  }
  const rem = filtered.length - shown;
  const moreBtn = document.getElementById('show-more-btn');
  moreBtn.style.display = rem>0 ? 'inline-block' : 'none';
  if(rem>0) moreBtn.textContent = `Show more (${rem} remaining)`;
}

function updateSourceFieldsVisibility(){
  const isProduct = document.getElementById('f-source').value === 'products';
  document.getElementById('product-fields').style.display = isProduct ? 'block' : 'none';
  document.getElementById('ingredients-product-field').style.display = isProduct ? 'block' : 'none';
  document.getElementById('ingredients-recipe-field').style.display = isProduct ? 'none' : 'block';
  document.getElementById('allergen-checkboxes-fields').style.display = isProduct ? 'block' : 'none';
  document.getElementById('allergen-auto-note').style.display = isProduct ? 'none' : 'block';
  if(!isProduct) renderAllergenPreview();
}
document.getElementById('f-source').addEventListener('change', updateSourceFieldsVisibility);

function computeAllergensFromIngredients(){
  const containsSet=new Set(), maySet=new Set();
  currentIngredients.forEach(ing=>{
    (ing.contains||[]).forEach(a=>containsSet.add(a));
    (ing.may_contain||[]).forEach(a=>maySet.add(a));
  });
  const contains=[...containsSet];
  const may_contain=[...maySet].filter(a=>!containsSet.has(a));
  return {contains, may_contain};
}
function renderAllergenPreview(){
  const {contains, may_contain}=computeAllergensFromIngredients();
  const preview=document.getElementById('allergen-preview');
  if(contains.length===0 && may_contain.length===0){
    preview.innerHTML='<span style="font-size:.76rem;color:var(--muted)">No allergens detected yet</span>';
    return;
  }
  preview.innerHTML=[
    ...contains.map(a=>`<span class="tag">${a}</span>`),
    ...may_contain.map(a=>`<span class="tag" style="background:var(--amber-bg);color:var(--amber);border-color:var(--amber-border)">${a} (may)</span>`)
  ].join('');
}

function renderIngredientList(){
  const box=document.getElementById('ingredient-list');
  if(currentIngredients.length===0){
    box.innerHTML='<div class="ing-picker-empty">No ingredients added yet.</div>';
  } else {
    box.innerHTML=currentIngredients.map((ing,i)=>`
      <div class="ing-picker-row">
        <span>${ing.text.replace(/&/g,'&amp;').replace(/</g,'&lt;')}</span>
        <button type="button" data-remove-idx="${i}">✕</button>
      </div>`).join('');
  }
  renderAllergenPreview();
}
document.getElementById('ingredient-list').addEventListener('click', e=>{
  const btn=e.target.closest('button[data-remove-idx]');
  if(!btn) return;
  currentIngredients.splice(parseInt(btn.dataset.removeIdx,10),1);
  renderIngredientList();
});

let ingredientSearchDeb;
document.getElementById('ingredient-search').addEventListener('input', e=>{
  clearTimeout(ingredientSearchDeb);
  const q=e.target.value.trim();
  ingredientSearchDeb=setTimeout(()=>{
    const results=document.getElementById('ingredient-search-results');
    if(!q){ results.classList.remove('open'); results.innerHTML=''; return; }
    const matches=DATA.map(p=>[p,scoreM(p.name,q)]).filter(([,s])=>s>0).sort(([,a],[,b])=>b-a).slice(0,8).map(([p])=>p);
    if(matches.length===0){
      results.innerHTML='<div class="ing-result" style="color:var(--muted)">No matches found</div>';
    } else {
      results.innerHTML=matches.map((p,i)=>`<div class="ing-result" data-pick-idx="${i}">${p.name}${p.details?.brand?' · '+p.details.brand:''} <span style="color:var(--muted);font-size:.7rem">(${p.source==='recipes'?'recipe':'product'})</span></div>`).join('');
      results.dataset.matches=JSON.stringify(matches.map(p=>({name:p.name, contains:p.contains||[], may_contain:p.may_contain||[]})));
    }
    results.classList.add('open');
  }, 200);
});
document.getElementById('ingredient-search-results').addEventListener('click', e=>{
  const row=e.target.closest('.ing-result[data-pick-idx]');
  if(!row) return;
  const matches=JSON.parse(e.currentTarget.dataset.matches||'[]');
  const picked=matches[parseInt(row.dataset.pickIdx,10)];
  if(!picked) return;
  const results=e.currentTarget;
  results.innerHTML=`<div class="ing-qty-row">
    <div class="ing-qty-name">${picked.name}</div>
    <div class="ing-qty-controls">
      <input type="number" step="0.01" id="qty-input" placeholder="Qty" autofocus>
      <select id="qty-unit"><option>g</option><option>kg</option><option>ml</option><option>l</option></select>
      <button type="button" class="btn btn-primary" id="qty-add-btn">Add</button>
    </div>
  </div>`;
  document.getElementById('qty-add-btn').addEventListener('click', ()=>{
    const qty=document.getElementById('qty-input').value.trim();
    const unit=document.getElementById('qty-unit').value;
    if(!qty){ return; }
    currentIngredients.push({text:`${picked.name} - ${qty}${unit}`, contains:picked.contains, may_contain:picked.may_contain});
    renderIngredientList();
    results.classList.remove('open');
    results.innerHTML='';
    document.getElementById('ingredient-search').value='';
  });
});
document.addEventListener('click', e=>{
  const recipeField=document.getElementById('ingredients-recipe-field');
  if(!e.composedPath().includes(recipeField)){
    document.getElementById('ingredient-search-results').classList.remove('open');
  }
});

function openModal(item){
  editingId = item ? item.id : null;
  document.getElementById('modal-title').textContent = item ? 'Edit Product' : 'Add Product';
  const d = (item && item.details) || {};
  document.getElementById('f-name').value = item?.name || '';
  document.getElementById('f-source').value = item?.source || 'products';
  document.getElementById('f-kcal').value = item?.kcal ?? '';
  document.getElementById('f-brand').value = d.brand || '';
  document.getElementById('f-fat').value = d.fat ?? '';
  document.getElementById('f-protein').value = d.protein ?? '';
  document.getElementById('f-carbs').value = d.carbs ?? '';
  document.getElementById('f-country').value = d.country || '';
  document.getElementById('f-ingredients').value = d.ingredients || '';
  currentIngredients = (item?.source==='recipes' && d.ingredients)
    ? d.ingredients.split('\n').filter(Boolean).map(resolveIngredientLine)
    : [];
  renderIngredientList();
  document.getElementById('ingredient-search').value='';
  document.getElementById('ingredient-search-results').classList.remove('open');
  document.getElementById('f-method').value = d.method || '';
  document.getElementById('f-description').value = d.description || '';
  document.getElementById('f-notes').value = d.notes || '';
  document.getElementById('f-diet').value = (item?.diet||[]).join(', ');
  const contains = new Set(item?.contains||[]);
  const may = new Set(item?.may_contain||[]);
  document.querySelectorAll('#contains-grid input').forEach(cb=>cb.checked = contains.has(cb.value));
  document.querySelectorAll('#may-grid input').forEach(cb=>cb.checked = may.has(cb.value));
  updateSourceFieldsVisibility();
  document.getElementById('edit-modal').classList.add('open');
}
window.closeModal = function(){
  document.getElementById('edit-modal').classList.remove('open');
};

function numOrUndefined(v){
  if(v === '' || v === null || v === undefined) return undefined;
  const n = parseFloat(v);
  return isNaN(n) ? undefined : n;
}

async function saveProduct(){
  const name = document.getElementById('f-name').value.trim();
  if(!name){ showStatus('Name is required', false); return; }
  const source = document.getElementById('f-source').value;
  const isProduct = source === 'products';
  const details = {};
  const method = document.getElementById('f-method').value.trim(); if(method) details.method = method;
  const description = document.getElementById('f-description').value.trim(); if(description) details.description = description;
  const notes = document.getElementById('f-notes').value.trim(); if(notes) details.notes = notes;
  if(isProduct){
    const brand = document.getElementById('f-brand').value.trim(); if(brand) details.brand = brand;
    const country = document.getElementById('f-country').value.trim(); if(country) details.country = country;
    const ingredients = document.getElementById('f-ingredients').value.trim(); if(ingredients) details.ingredients = ingredients;
    const fat = numOrUndefined(document.getElementById('f-fat').value); if(fat!==undefined) details.fat = fat;
    const protein = numOrUndefined(document.getElementById('f-protein').value); if(protein!==undefined) details.protein = protein;
    const carbs = numOrUndefined(document.getElementById('f-carbs').value); if(carbs!==undefined) details.carbs = carbs;
  } else if(currentIngredients.length){
    details.ingredients = currentIngredients.map(i=>i.text).join('\n');
  }

  const diet = document.getElementById('f-diet').value.split(',').map(s=>s.trim()).filter(Boolean);
  let contains, may_contain;
  if(isProduct){
    contains = Array.from(document.querySelectorAll('#contains-grid input:checked')).map(cb=>cb.value);
    may_contain = Array.from(document.querySelectorAll('#may-grid input:checked')).map(cb=>cb.value);
  } else {
    ({contains, may_contain} = computeAllergensFromIngredients());
  }

  const existing = editingId ? DATA.find(x=>x.id===editingId) : null;
  const payload = {
    name,
    source,
    kcal: isProduct ? (numOrUndefined(document.getElementById('f-kcal').value) ?? null) : null,
    contains, may_contain, details, diet,
    ...(existing?.createdBy ? {createdBy: existing.createdBy} : {}),
    ...(existing?.createdByName ? {createdByName: existing.createdByName} : {})
  };

  try{
    if(editingId){
      await setDoc(doc(db,'products',editingId), payload, {merge:false});
    } else {
      await addDoc(collection(db,'products'), payload);
    }
    await bumpCatalogVersion();
    showStatus('Saved successfully');
    closeModal();
    await loadData();
  }catch(e){
    console.error(e);
    showStatus('Save failed: '+e.message, false);
  }
}

document.getElementById('save-btn').addEventListener('click', saveProduct);
document.getElementById('add-btn').addEventListener('click', ()=>openModal(null));
document.getElementById('admin-search').addEventListener('input', applyFilter);
document.getElementById('show-more-btn').addEventListener('click', ()=>renderTable(false));

document.getElementById('table-body').addEventListener('click', async (e)=>{
  const btn = e.target.closest('button[data-action]');
  if(!btn) return;
  const id = btn.dataset.id;
  const item = DATA.find(x=>x.id===id);
  if(btn.dataset.action==='edit'){
    openModal(item);
  } else if(btn.dataset.action==='delete'){
    if(!confirm(`Delete "${item?.name}"? This cannot be undone.`)) return;
    try{
      await deleteDoc(doc(db,'products',id));
      await bumpCatalogVersion();
      showStatus('Deleted');
      await loadData();
    }catch(err){
      showStatus('Delete failed: '+err.message, false);
    }
  }
});

document.getElementById('login-btn').addEventListener('click', async ()=>{
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.style.display = 'none';
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(e){
    errEl.textContent = 'Login failed: ' + e.message;
    errEl.style.display = 'block';
  }
});
document.getElementById('logout-btn').addEventListener('click', ()=>signOut(auth));

function placeThemeToggle(inApp){
  const btn = document.getElementById('theme-toggle');
  if(inApp){
    document.getElementById('theme-toggle-slot').appendChild(btn);
    btn.classList.remove('floating');
  } else {
    document.body.insertBefore(btn, document.body.firstChild);
    btn.classList.add('floating');
  }
}

onAuthStateChanged(auth, (user)=>{
  if(user){
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-screen').style.display = 'block';
    document.getElementById('user-email').textContent = user.email;
    placeThemeToggle(true);
    loadData();
    loadChefRequests();
  } else {
    document.getElementById('login-screen').style.display = 'block';
    document.getElementById('app-screen').style.display = 'none';
    placeThemeToggle(false);
  }
});

function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function applyThemeIcon(){
  document.getElementById('theme-toggle').textContent = currentTheme()==='dark' ? '☀️' : '🌙';
}
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutriziz-theme', next);
  applyThemeIcon();
});
applyThemeIcon();
</script>
</body>
</html>
