<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutriziz — Allergen Database</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f0f2f7;--surface:#fff;--surface2:#e8ebf4;
  --border:#d0d6e8;--border-light:#e2e7f5;
  --accent:#3a6fd8;--accent2:#6244b0;
  --text:#1a1f36;--text2:#4a5175;--muted:#7a82a3;
  --red:#c94040;--red-bg:#fdf0f0;--red-border:#f0c0c0;
  --amber:#c47a00;--amber-bg:#fdf6e3;--amber-border:#f0dca0;
  --green:#1e8a54;--green-bg:#edfaf3;--green-border:#b0e8cc;
  --r:14px;--sh:0 2px 12px rgba(30,40,100,.08);--sh-lg:0 8px 40px rgba(30,40,100,.15)
}
body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:20px 28px 16px;text-align:center;position:sticky;top:0;z-index:100;box-shadow:0 2px 16px rgba(30,40,100,.07)}
.chef-login-link{position:absolute;top:16px;left:16px;display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:.75rem;font-weight:600;text-decoration:none;transition:all .15s}
.chef-login-link:hover{border-color:var(--accent);color:var(--accent);background:#f0f5ff}
.admin-login-link{position:absolute;top:16px;right:16px;display:flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-size:.75rem;font-weight:600;text-decoration:none;transition:all .15s}
.admin-login-link:hover{border-color:var(--accent);color:var(--accent);background:#f0f5ff}
.header-top{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:14px}
.logo-icon{width:38px;height:38px;background:linear-gradient(135deg,var(--accent),var(--accent2));border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px}
h1{font-size:1.35rem;font-weight:700;letter-spacing:-.02em}
h1 span{color:var(--accent)}
.tagline{font-size:.76rem;color:var(--muted);margin-top:2px}
.search-wrap{position:relative;max-width:600px;margin:0 auto}
.search-icon{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:14px;pointer-events:none}
#search{width:100%;padding:12px 18px 12px 42px;background:var(--surface2);border:1.5px solid var(--border);border-radius:50px;color:var(--text);font-family:'Inter',sans-serif;font-size:.9rem;outline:none;transition:all .2s}
#search:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(58,111,216,.12)}
#search::placeholder{color:var(--muted)}
.stats-bar{display:flex;align-items:center;justify-content:center;gap:12px;padding:8px 0 0;font-size:.74rem;color:var(--muted)}
.stats-bar b{color:var(--text2);font-weight:600}
.credit{font-size:.7rem;color:var(--muted);margin-top:6px}
.credit b{color:var(--text2)}
.source-tabs{display:flex;gap:6px;justify-content:center;padding:11px 20px 0;flex-wrap:wrap}
.tab{padding:5px 14px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--text2);font-family:'Inter',sans-serif;font-size:.71rem;font-weight:600;cursor:pointer;transition:all .15s}
.tab:hover{border-color:var(--accent2);color:var(--accent2)}
.tab.active{background:var(--accent2);border-color:var(--accent2);color:#fff}
main{max-width:1120px;margin:0 auto;padding:18px 14px 0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(295px,1fr));gap:13px}
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:var(--r);padding:15px;box-shadow:var(--sh);transition:all .15s;display:flex;flex-direction:column;gap:9px}
.card:hover{border-color:var(--accent);box-shadow:0 4px 20px rgba(58,111,216,.12);transform:translateY(-2px)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.card-title-area{flex:1}
.recipe-name{font-size:.87rem;font-weight:600;line-height:1.35;color:var(--text)}
.recipe-meta{font-size:.67rem;color:var(--muted);margin-top:3px}
.source-tag{font-size:.59rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;padding:2px 6px;border-radius:5px;margin-top:4px;display:inline-block}
.source-tag.products{background:#eef3ff;color:var(--accent)}
.source-tag.recipes{background:#f2eeff;color:var(--accent2)}
.kcal-badge{background:linear-gradient(135deg,var(--accent2),var(--accent));color:#fff;border-radius:8px;padding:5px 9px;font-size:.79rem;font-weight:700;white-space:nowrap;flex-shrink:0;text-align:center;line-height:1.2}
.kcal-badge small{font-size:.57rem;opacity:.85;display:block;font-weight:400}
.sec-label{font-size:.61rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;margin-bottom:5px}
.sec-label.contains{color:var(--red)}
.sec-label.may{color:var(--amber)}
.allergen-icons{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.ap{display:flex;align-items:center;gap:3px;padding:3px 8px;border-radius:20px;font-size:.66rem;font-weight:600}
.ap.contains{background:var(--red-bg);border:1px solid var(--red-border);color:var(--red)}
.ap.may{background:var(--amber-bg);border:1px solid var(--amber-border);color:var(--amber)}
.ap .pi{font-size:12px}
.safe-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;background:var(--green-bg);border:1px solid var(--green-border);border-radius:20px;color:var(--green);font-size:.67rem;font-weight:600}
.diet-row{display:flex;flex-wrap:wrap;gap:4px}
.diet-tag{font-size:.61rem;font-weight:600;padding:2px 7px;border-radius:9px;background:#eefaf4;border:1px solid #b8eacf;color:#1a7a4a}
.btn-details{display:flex;align-items:center;gap:4px;padding:5px 10px;background:#f0f5ff;border:1.5px solid var(--border);border-radius:7px;color:var(--accent);font-family:'Inter',sans-serif;font-size:.68rem;font-weight:600;cursor:pointer;transition:all .15s;width:fit-content}
.btn-details:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,25,60,.45);z-index:1000;align-items:center;justify-content:center;padding:16px;backdrop-filter:blur(4px)}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:600px;max-height:88vh;overflow-y:auto;box-shadow:var(--sh-lg);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:scale(.95) translateY(10px)}to{opacity:1;transform:none}}
.modal-header{padding:18px 20px 14px;border-bottom:1px solid var(--border-light);position:sticky;top:0;background:var(--surface);border-radius:18px 18px 0 0;display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.modal-title{font-size:.98rem;font-weight:700;line-height:1.3}
.modal-sub{font-size:.73rem;color:var(--muted);margin-top:3px}
.btn-close{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.btn-close:hover{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn-back{padding:6px 12px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface2);color:var(--text2);font-family:'Inter',sans-serif;font-size:.74rem;font-weight:600;cursor:pointer;flex-shrink:0}
.btn-back:hover{border-color:var(--accent);color:var(--accent)}
.ing-line{padding:6px 0;border-bottom:1px dashed var(--border-light);display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.ing-line:last-child{border-bottom:none}
.ing-line.linked{cursor:pointer;color:var(--accent2)}
.ing-line.linked:hover{text-decoration:underline}
.modal-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:18px}
.detail-section{}
.detail-label{font-size:.66rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:8px}
.detail-value{font-size:.82rem;color:var(--text2);line-height:1.7}
.nut-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.nut-cell{background:var(--surface2);border-radius:9px;padding:9px 6px;text-align:center}
.nut-val{font-size:.98rem;font-weight:700}
.nut-unit{font-size:.58rem;color:var(--muted)}
.nut-lbl{font-size:.61rem;color:var(--text2);margin-top:2px;font-weight:500}
.method-box{background:var(--surface2);border-radius:10px;padding:13px 15px;font-size:.81rem;color:var(--text2);line-height:1.75;white-space:pre-wrap;border-left:3px solid var(--accent)}
.ing-box{background:#fafbff;border:1px solid var(--border-light);border-radius:10px;padding:13px 15px;font-size:.79rem;color:var(--text2);line-height:1.75;white-space:pre-wrap}
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:42px;margin-bottom:12px}
.empty h3{font-size:.98rem;color:var(--text2);margin-bottom:5px}
.show-more-wrap{text-align:center;padding:22px 0 0}
#show-more{padding:10px 32px;background:var(--surface);border:1.5px solid var(--border);border-radius:50px;color:var(--text2);font-family:'Inter',sans-serif;font-size:.83rem;font-weight:500;cursor:pointer;transition:all .2s;box-shadow:var(--sh)}
#show-more:hover{border-color:var(--accent);color:var(--accent);background:#f0f5ff}
@media(max-width:600px){
  header{padding:13px 12px 11px}h1{font-size:1.1rem}
  .grid{grid-template-columns:1fr}.nut-grid{grid-template-columns:repeat(2,1fr)}
  .chef-login-link{position:static;display:inline-flex;margin-bottom:8px}
  .admin-login-link{position:static;display:inline-flex;margin-bottom:8px;margin-left:8px}
}
</style>
</head>
<body>
<header>
  <a class="chef-login-link" href="./chef.html">👨‍🍳 Chef Login</a>
  <a class="admin-login-link" href="./admin.html">🔐 Admin Login</a>
  <div class="header-top">
    <div class="logo-icon">
      <svg viewBox="0 0 100 100" width="22" height="22" fill="none">
        <circle cx="50" cy="50" r="41" stroke="#fff" stroke-width="5" stroke-dasharray="7 9"/>
        <path d="M30 70 V30 L50 56 L70 30 V70" stroke="#fff" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1>Nutri<span>ziz</span></h1>
  </div>
  <div class="tagline">Recipe &amp; Product Allergen Database</div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search... e.g. chicken, hummus, cheddar" autocomplete="off" autofocus>
  </div>
  <div class="stats-bar">
    <span>Total: <b id="total-count">0</b></span><span>·</span><span>Results: <b id="result-count">0</b></span>
  </div>
  <div class="credit">Made by <b>Abdullaziz Alghofaily</b> · AL TAMIMI · Nutritionist</div>
</header>
<div class="source-tabs">
  <button class="tab active" data-source="all">All</button>
  <button class="tab" data-source="products">📦 Products</button>
  <button class="tab" data-source="recipes">📋 Recipes</button>
</div>
<main>
  <div class="grid" id="grid"></div>
  <div class="show-more-wrap"><button id="show-more" style="display:none">Show more</button></div>
</main>
<div class="modal-overlay" id="view-modal">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-title" id="view-title"></div><div class="modal-sub" id="view-sub"></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-back" id="view-back" style="display:none" onclick="goBack()">← Back</button>
        <button class="btn-close" onclick="closeModal('view-modal')">✕</button>
      </div>
    </div>
    <div class="modal-body" id="view-body"></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const CACHE_KEY = 'neom_products_cache_v1';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 hours
const AI={'Gluten':'🌾','Tree nuts':'🌰','Peanuts':'🥜','Eggs':'🥚','Milk':'🥛','Fish':'🐟','Crustaceans':'🦐','Molluscs':'🦑','Celery':'🥬','Mustard':'🌼','Sesame':'🫘','Soya':'🫛','Sulphites':'⚗️','Lupin':'🌿'};
let DATA=[];
async function loadData(){
  const grid=document.getElementById('grid');
  const cached=localStorage.getItem(CACHE_KEY);
  let cachedParsed=null;
  if(cached){
    try{ cachedParsed=JSON.parse(cached); }catch(e){}
  }
  let useCache=false;
  if(cachedParsed && Date.now()-cachedParsed.ts<CACHE_TTL_MS){
    try{
      const countSnap=await getCountFromServer(collection(db,'products'));
      useCache = cachedParsed.count===countSnap.data().count;
    }catch(e){
      console.error('Catalog count check failed, forcing a fresh fetch',e);
      useCache=false;
    }
  }
  if(useCache){
    DATA=cachedParsed.items;indexData();render(true);return;
  }
  grid.innerHTML='<div class="empty"><div class="empty-icon">⏳</div><h3>Loading database…</h3></div>';
  try{
    const snap=await getDocs(collection(db,'products'));
    DATA=snap.docs.map(d=>({id:d.id,...d.data()}));
    indexData();
    localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),count:DATA.length,items:DATA}));
  }catch(e){
    console.error('Failed to load products from Firestore',e);
    grid.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load database</h3><p>Check your Firebase configuration and connection</p></div>';
    return;
  }
  render(true);
}

const PAGE=30;
let filtered=[],shown=0,curSource='all',curQuery='';

function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function scoreM(name,q){
  const n=norm(name),qn=norm(q);
  if(n.startsWith(qn))return 3;if(n.includes(qn))return 2;
  const w=qn.split(' ').filter(Boolean),h=w.filter(x=>n.includes(x));
  return h.length===w.length?1:h.length>0?.5:0;
}

let DATA_BY_ID=new Map(),NAME_INDEX=new Map();
function indexData(){
  DATA_BY_ID=new Map();NAME_INDEX=new Map();
  DATA.forEach(rec=>{
    DATA_BY_ID.set(String(rec.id),rec);
    const k=norm(rec.name||'');
    if(!NAME_INDEX.has(k)) NAME_INDEX.set(k,[]);
    NAME_INDEX.get(k).push(rec);
  });
}
const QTY_RE=/^(.*?)\s*-\s*[\d.,\/]+\s*(?:g|kg|ml|l)\s*$/i;
function tokenScore(name,query){
  const nTokens=norm(name).split(' ').filter(Boolean),qTokens=norm(query).split(' ').filter(Boolean);
  if(qTokens.length<2) return 0;
  let matchedCount=0;
  for(const qt of qTokens){
    const found=nTokens.some(nt=>nt===qt||(Math.abs(nt.length-qt.length)<=2&&(nt.startsWith(qt)||qt.startsWith(nt))));
    if(found) matchedCount++;
  }
  if(matchedCount!==qTokens.length) return 0;
  const diff=Math.abs(nTokens.length-qTokens.length);
  if(diff>3) return 0;
  return 1+(1/(1+diff));
}
function matchIngredientLine(line){
  const m=line.match(QTY_RE);
  const base=(m?m[1]:line).trim();
  if(!base) return null;
  const exact=NAME_INDEX.get(norm(base));
  if(exact&&exact.length) return exact[0];
  let best=null,bestScore=0;
  DATA.forEach(rec=>{
    const s=tokenScore(rec.name,base);
    if(s>bestScore){bestScore=s;best=rec;}
  });
  return best;
}
function getFiltered(){
  let r=DATA;
  if(curSource!=='all') r=r.filter(x=>x.source===curSource);
  const q=curQuery.trim();
  if(q) r=r.map(x=>[x,scoreM(x.name,q)]).filter(([,s])=>s>0).sort(([,a],[,b])=>b-a).map(([x])=>x);
  return r;
}
function pills(list,cls){return(list||[]).map(a=>`<div class="ap ${cls}"><span class="pi">${AI[a]||'⚠️'}</span>${a}</div>`).join('')}
function buildCard(r,idx){
  const kcal=r.kcal!=null?parseFloat(r.kcal).toFixed(0):'—';
  const d=r.details||{};
  const meta=[d.brand&&'🏷️ '+d.brand,d.category].filter(Boolean).join(' · ');
  const c=r.contains||[],m=r.may_contain||[];
  let alHTML=c.length===0&&m.length===0?'<div class="safe-badge">✅ No allergens</div>':'';
  if(c.length) alHTML+=`<div class="sec-label contains">⚠️ Contains</div><div class="allergen-icons">${pills(c,'contains')}</div>`;
  if(m.length) alHTML+=`<div class="sec-label may">〰️ May Contain</div><div class="allergen-icons">${pills(m,'may')}</div>`;
  const diet=(r.diet||[]).map(dt=>`<span class="diet-tag">${dt}</span>`).join('');
  const hasD=d.ingredients||d.country||d.brand||d.description||d.notes||d.fat!=null||d.protein!=null||d.carbs!=null||d.method;
  return `<div class="card">
    <div class="card-top">
      <div class="card-title-area">
        <div class="recipe-name">${r.name}</div>
        ${meta?`<div class="recipe-meta">${meta}</div>`:''}
        <span class="source-tag ${r.source}">${r.source==='products'?'📦 Product':'📋 Recipe'}</span>
      </div>
      <div class="kcal-badge">${kcal}<small>kcal/100g</small></div>
    </div>
    <div>${alHTML}</div>
    ${diet?`<div class="diet-row">${diet}</div>`:''}
    ${hasD?`<button class="btn-details" onclick="openView(${idx})">📋 View Details</button>`:''}
  </div>`;
}
function render(reset=true){
  if(reset){filtered=getFiltered();shown=0;}
  const grid=document.getElementById('grid');
  const si=shown,chunk=filtered.slice(shown,shown+PAGE);
  shown+=chunk.length;
  if(reset) grid.innerHTML='';
  grid.insertAdjacentHTML('beforeend',filtered.length===0
    ?'<div class="empty"><div class="empty-icon">🔍</div><h3>No results found</h3><p>Try a different search or filter</p></div>'
    :chunk.map((r,i)=>buildCard(r,si+i)).join(''));
  document.getElementById('result-count').textContent=filtered.length.toLocaleString();
  document.getElementById('total-count').textContent=DATA.length.toLocaleString();
  const btn=document.getElementById('show-more'),rem=filtered.length-shown;
  btn.style.display=rem>0?'inline-block':'none';
  if(rem>0) btn.textContent=`Show more (${rem.toLocaleString()} remaining)`;
}
function esc(t){return t?String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function ingredientLineHTML(line){
  line=line.trim();
  if(!line) return '';
  const match=matchIngredientLine(line);
  if(!match) return `<div class="ing-line">${esc(line)}</div>`;
  const c=match.contains||[],m=match.may_contain||[];
  const tags=[...c.map(a=>`<span class="ap contains">${AI[a]||'⚠️'} ${a}</span>`),
              ...m.map(a=>`<span class="ap may">${AI[a]||'⚠️'} ${a}</span>`)].join('');
  return `<div class="ing-line linked" onclick="showDetailsById('${match.id}')">${esc(line)}${tags}</div>`;
}
let viewStack=[],currentRecord=null;
function showDetails(r){
  currentRecord=r;
  const d=r.details||{};
  document.getElementById('view-title').textContent=r.name;
  document.getElementById('view-sub').textContent=[d.brand,d.category].filter(Boolean).join(' · ');
  const kc=r.kcal!=null?parseFloat(r.kcal).toFixed(0):'—';
  const fat=d.fat!=null?d.fat+'g':'—',prot=d.protein!=null?d.protein+'g':'—',carb=d.carbs!=null?d.carbs+'g':'—';
  const c=r.contains||[],m=r.may_contain||[];
  const ap=[...c.map(a=>`<span class="ap contains" style="display:inline-flex;margin:2px">${AI[a]||'⚠️'} ${a}</span>`),
            ...m.map(a=>`<span class="ap may" style="display:inline-flex;margin:2px">${AI[a]||'⚠️'} ${a}</span>`)];
  let b='';
  b+=`<div class="detail-section"><div class="detail-label">Nutrition per 100g</div><div class="nut-grid">
    <div class="nut-cell"><div class="nut-val">${kc}</div><div class="nut-unit">kcal</div><div class="nut-lbl">Energy</div></div>
    <div class="nut-cell"><div class="nut-val">${fat}</div><div class="nut-unit">per 100g</div><div class="nut-lbl">Fat</div></div>
    <div class="nut-cell"><div class="nut-val">${prot}</div><div class="nut-unit">per 100g</div><div class="nut-lbl">Protein</div></div>
    <div class="nut-cell"><div class="nut-val">${carb}</div><div class="nut-unit">per 100g</div><div class="nut-lbl">Carbs</div></div>
  </div></div>`;
  b+=`<div class="detail-section"><div class="detail-label">Allergens</div>${ap.length?`<div style="display:flex;flex-wrap:wrap;gap:3px">${ap.join('')}</div>`:'<div class="safe-badge">✅ No allergens</div>'}</div>`;
  if(d.brand||d.country) b+=`<div class="detail-section"><div class="detail-label">Product Info</div><div class="detail-value">${[d.brand&&`<b>Brand:</b> ${esc(d.brand)}`,d.country&&`<b>Country:</b> ${esc(d.country)}`].filter(Boolean).join('<br>')}</div></div>`;
  if(r.diet?.length) b+=`<div class="detail-section"><div class="detail-label">Dietary</div><div style="display:flex;gap:4px;flex-wrap:wrap">${r.diet.map(dt=>`<span class="diet-tag">${dt}</span>`).join('')}</div></div>`;
  if(d.ingredients){
    const body=r.source==='recipes'
      ?d.ingredients.split('\n').map(ingredientLineHTML).join('')
      :esc(d.ingredients);
    b+=`<div class="detail-section"><div class="detail-label">🥕 Food Ingredients</div><div class="ing-box">${body}</div></div>`;
  }
  if(d.method) b+=`<div class="detail-section"><div class="detail-label">👨‍🍳 Recipe Method</div><div class="method-box">${esc(d.method)}</div></div>`;
  if(d.description) b+=`<div class="detail-section"><div class="detail-label">Description</div><div class="detail-value">${esc(d.description)}</div></div>`;
  if(d.notes) b+=`<div class="detail-section"><div class="detail-label">Notes</div><div class="detail-value">${esc(d.notes)}</div></div>`;
  document.getElementById('view-body').innerHTML=b;
  document.getElementById('view-back').style.display=viewStack.length?'inline-block':'none';
}
function openView(idx){
  viewStack=[];
  showDetails(filtered[idx]);
  document.getElementById('view-modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function showDetailsById(id){
  const rec=DATA_BY_ID.get(String(id));
  if(!rec) return;
  if(currentRecord) viewStack.push(currentRecord);
  showDetails(rec);
  document.getElementById('view-body').scrollTop=0;
}
function goBack(){
  const prev=viewStack.pop();
  if(prev) showDetails(prev);
}
function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
window.openView=openView;
window.closeModal=closeModal;
window.showDetailsById=showDetailsById;
window.goBack=goBack;
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(m=>closeModal(m.id));});
let deb;
document.getElementById('search').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{curQuery=e.target.value;render(true);},200);});
document.querySelectorAll('.tab[data-source]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab[data-source]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');curSource=b.dataset.source;render(true);
}));
document.getElementById('show-more').addEventListener('click',()=>render(false));
loadData();
</script>
</body>
</html>
