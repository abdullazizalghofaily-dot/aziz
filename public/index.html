<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nutriziz — Allergen Database</title>
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<script>
(function(){
  var saved = localStorage.getItem('nutriziz-theme');
  if(saved) document.documentElement.setAttribute('data-theme', saved);
})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#eeece3;--surface:#f6f5ef;--surface2:#e7e5da;
  --border:#c9cfbd;--border-light:#d6dac8;
  --accent:#2f6f4e;--accent2:#c8703a;
  --text:#1e2a22;--text2:#4a5647;--muted:#7c8577;--faint:#a8a296;
  --red:#c94040;--red-bg:#fdf0f0;--red-border:#f0c0c0;
  --amber:#c47a00;--amber-bg:#fdf6e3;--amber-border:#f0dca0;
  --green:#1e8a54;--green-bg:#edfaf3;--green-border:#b0e8cc;
  --olive:#3a4025;--olive-text:#bcc39c;--olive-text-active:#dcec8e;
  --font:'Poppins',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',monospace;
  --sh-lg:-16px 0 40px rgba(30,42,34,.16)
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11160e;--surface:#171d13;--surface2:#1b2216;
    --border:#2c3524;--border-light:#232b1c;
    --accent:#6fbf8f;--accent2:#e2955c;
    --text:#eaf0e4;--text2:#b7c0ac;--muted:#818a72;--faint:#5b6350;
    --red:#e8837e;--red-bg:#2a1a19;--red-border:#4a2b29;
    --amber:#e6ac4c;--amber-bg:#2a2417;--amber-border:#4a3e28;
    --green:#5fd097;--green-bg:#182920;--green-border:#274a37;
    --olive:#242a15;--olive-text:#8f9877;--olive-text-active:#dcec8e;
    --sh-lg:-16px 0 40px rgba(0,0,0,.45)
  }
}
:root[data-theme="dark"]{
  --bg:#11160e;--surface:#171d13;--surface2:#1b2216;
  --border:#2c3524;--border-light:#232b1c;
  --accent:#6fbf8f;--accent2:#e2955c;
  --text:#eaf0e4;--text2:#b7c0ac;--muted:#818a72;--faint:#5b6350;
  --red:#e8837e;--red-bg:#2a1a19;--red-border:#4a2b29;
  --amber:#e6ac4c;--amber-bg:#2a2417;--amber-border:#4a3e28;
  --green:#5fd097;--green-bg:#182920;--green-border:#274a37;
  --olive:#242a15;--olive-text:#8f9877;--olive-text-active:#dcec8e;
  --sh-lg:-16px 0 40px rgba(0,0,0,.45)
}
:root[data-theme="light"]{
  --bg:#eeece3;--surface:#f6f5ef;--surface2:#e7e5da;
  --border:#c9cfbd;--border-light:#d6dac8;
  --accent:#2f6f4e;--accent2:#c8703a;
  --text:#1e2a22;--text2:#4a5647;--muted:#7c8577;--faint:#a8a296;
  --red:#c94040;--red-bg:#fdf0f0;--red-border:#f0c0c0;
  --amber:#c47a00;--amber-bg:#fdf6e3;--amber-border:#f0dca0;
  --green:#1e8a54;--green-bg:#edfaf3;--green-border:#b0e8cc;
  --olive:#3a4025;--olive-text:#bcc39c;--olive-text-active:#dcec8e;
  --sh-lg:-16px 0 40px rgba(30,42,34,.16)
}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:60px;transition:background .2s,color .2s}
::selection{background:#c8703a33}
header{background:var(--surface);border-bottom:1px solid var(--border);padding:22px 24px 0;text-align:center;position:sticky;top:0;z-index:100}
.header-row{max-width:900px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}
.header-links{display:flex;gap:10px;font-size:.72rem;font-weight:600}
.chef-login-link,.admin-login-link{white-space:nowrap;display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);text-decoration:none;transition:all .15s}
.chef-login-link:hover,.admin-login-link:hover{border-color:var(--accent);color:var(--accent)}
#theme-toggle{width:30px;height:30px;flex-shrink:0;border-radius:6px;border:1px solid var(--border);background:var(--surface);color:var(--text2);font-size:.85rem;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s}
#theme-toggle:hover{border-color:var(--accent);color:var(--accent)}
.header-top{display:flex;align-items:center;justify-content:center;gap:10px}
h1{font-size:1.2rem;font-weight:600;letter-spacing:-.02em}
h1 .i-accent{color:var(--accent)}
h1 .ziz{color:var(--accent2);font-weight:700}
.tagline{font-size:.78rem;color:var(--muted);margin:14px 0}
.search-wrap{position:relative;max-width:560px;margin:0 auto 14px}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:13px;pointer-events:none}
#search{width:100%;padding:12px 16px 12px 40px;background:var(--surface2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:var(--font);font-size:.85rem;outline:none;transition:all .15s}
#search:focus{border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px rgba(47,111,78,.1)}
#search::placeholder{color:var(--faint)}
.stats-bar{font-size:.72rem;color:var(--muted);padding-bottom:12px}
.stats-bar b{color:var(--text2);font-weight:600;font-family:var(--mono)}
.credit{font-size:.68rem;color:var(--muted);padding-bottom:12px;margin-top:-8px}
.credit b{color:var(--text2)}
.source-tabs{display:flex;gap:0;justify-content:center;background:var(--olive);border-bottom:1px solid var(--border-light)}
.tab{padding:10px 22px;border:none;border-bottom:2.5px solid transparent;background:none;color:var(--olive-text);font-family:var(--font);font-size:.75rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase;cursor:pointer;transition:all .15s}
.tab:hover{color:var(--olive-text-active)}
.tab.active{border-bottom-color:var(--olive-text-active);color:var(--olive-text-active)}
main{max-width:920px;margin:0 auto;padding:26px 14px 60px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}
.card{background:var(--surface);border:1px solid var(--border-light);border-radius:8px;padding:18px;transition:all .15s;display:flex;flex-direction:column;gap:9px;cursor:pointer}
.card:hover{background:var(--surface2);border-color:var(--accent)}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:9px}
.card-title-area{flex:1}
.recipe-name{font-size:.83rem;font-weight:600;line-height:1.4;color:var(--text)}
.recipe-meta{font-size:.66rem;color:var(--faint);margin-top:4px}
.kcal-badge{font-family:var(--mono);font-size:.83rem;font-weight:600;color:var(--accent);white-space:nowrap;flex-shrink:0}
.kcal-badge small{font-size:.55rem;color:var(--muted);display:block;font-weight:500;font-family:var(--font)}
.sec-label{font-family:var(--mono);font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-bottom:5px}
.sec-label.contains{color:var(--red)}
.sec-label.may{color:var(--amber)}
.allergen-icons{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:2px}
.ap{display:inline-flex;align-items:center;padding:3px 8px;border-radius:4px;font-size:.6rem;font-weight:600;font-family:var(--mono)}
.ap.contains{background:none;border:1px solid var(--red-border);color:var(--red)}
.ap.may{background:none;border:1px solid var(--amber-border);color:var(--amber)}
.safe-badge{display:inline-flex;align-items:center;padding:3px 9px;border:1px solid var(--green-border);border-radius:4px;color:var(--green);font-size:.62rem;font-weight:600;font-family:var(--mono)}
.diet-row{display:flex;flex-wrap:wrap;gap:4px}
.diet-tag{font-size:.6rem;font-weight:600;padding:2px 7px;border-radius:4px;background:none;border:1px solid var(--green-border);color:var(--green)}
.btn-details{display:inline-flex;align-items:center;padding:5px 12px;background:none;border:1px solid var(--border);border-radius:6px;color:var(--accent);font-family:var(--font);font-size:.65rem;font-weight:600;cursor:pointer;transition:all .15s;width:fit-content}
.btn-details:hover{border-color:var(--accent);background:var(--surface2)}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,25,20,.35);z-index:1000;align-items:center;justify-content:center;padding:20px}
.modal-overlay.open{display:flex}
.modal{background:var(--surface);width:480px;max-width:92vw;max-height:88vh;overflow-y:auto;border-radius:12px;box-shadow:var(--sh-lg);animation:mIn .2s ease}
@keyframes mIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-header{padding:22px 24px 14px;border-bottom:1px solid var(--border-light);position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;border-radius:12px 12px 0 0}
.modal-title{font-size:.95rem;font-weight:700;line-height:1.3}
.modal-sub{font-size:.7rem;color:var(--muted);margin-top:4px}
.btn-close{width:26px;height:26px;border-radius:50%;border:1px solid var(--border);background:none;color:var(--muted);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.btn-close:hover{border-color:var(--red);color:var(--red)}
.btn-back{padding:6px 12px;border-radius:6px;border:1px solid var(--border);background:none;color:var(--text2);font-family:var(--font);font-size:.72rem;font-weight:600;cursor:pointer;flex-shrink:0}
.btn-back:hover{border-color:var(--accent);color:var(--accent)}
.ing-line{padding:5px 0;border-bottom:1px dashed var(--border-light);display:flex;flex-wrap:wrap;align-items:center;gap:5px;font-size:.73rem;color:var(--text2)}
.ing-line:last-child{border-bottom:none}
.ing-line.linked{cursor:pointer;color:var(--accent2);font-weight:500}
.ing-line.linked:hover{text-decoration:underline}
.modal-body{padding:22px 24px 30px;display:flex;flex-direction:column;gap:18px}
.detail-section{}
.detail-label{font-family:var(--mono);font-size:.58rem;font-weight:600;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:8px}
.detail-value{font-size:.78rem;color:var(--text2);line-height:1.7}
.nut-grid{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--border-light)}
.nut-cell{padding:9px 4px;text-align:center;border-right:1px solid var(--border-light)}
.nut-cell:last-child{border-right:none}
.nut-val{font-family:var(--mono);font-size:.88rem;font-weight:600}
.nut-unit{display:none}
.nut-lbl{font-size:.6rem;color:var(--muted);margin-top:2px;font-weight:500}
.method-box{background:var(--surface2);border-radius:0 6px 6px 0;padding:12px 14px;font-size:.76rem;color:var(--text2);line-height:1.75;white-space:pre-wrap;border-left:3px solid var(--accent)}
.ing-box{font-size:.73rem;color:var(--text2);line-height:1.75;white-space:pre-wrap}
.empty{text-align:center;padding:60px 20px;color:var(--muted);grid-column:1/-1}
.empty-icon{font-size:42px;margin-bottom:12px}
.empty h3{font-size:.98rem;color:var(--text2);margin-bottom:5px}
.show-more-wrap{text-align:center;padding:22px 0 0}
#show-more{padding:10px 28px;background:none;border:1px solid var(--border);border-radius:20px;color:var(--text2);font-family:var(--font);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .15s}
#show-more:hover{border-color:var(--accent);color:var(--accent)}
@media(max-width:640px){
  .grid{grid-template-columns:1fr}.nut-grid{grid-template-columns:repeat(2,1fr)}
  .nut-cell:nth-child(2){border-right:none}
}
</style>
</head>
<body>
<header>
  <div class="header-row">
    <div class="header-top">
      <h1>nutr<span class="i-accent">i</span><span class="ziz">ziz</span></h1>
    </div>
    <div class="header-links">
      <button id="theme-toggle" type="button" aria-label="Toggle dark mode"></button>
      <a class="chef-login-link" href="./chef.html">👨‍🍳 Chef Login</a>
      <a class="admin-login-link" href="./admin.html">🔐 Admin Login</a>
    </div>
  </div>
  <div class="tagline">Recipe &amp; Product Allergen Database</div>
  <div class="search-wrap">
    <span class="search-icon">🔍</span>
    <input type="text" id="search" placeholder="Search... e.g. chicken, hummus, cheddar" autocomplete="off" autofocus>
  </div>
  <div class="stats-bar">
    <span>Total: <b id="total-count">0</b></span><span>·</span><span>Results: <b id="result-count">0</b></span>
  </div>
  <div class="credit">Made by <b>Abdullaziz Alghofaily</b> · AL TAMIMI · Nutritionist</div>
</header>
<div class="source-tabs">
  <button class="tab active" data-source="all">All</button>
  <button class="tab" data-source="products">Products</button>
  <button class="tab" data-source="recipes">Recipes</button>
</div>
<main>
  <div class="grid" id="grid"></div>
  <div class="show-more-wrap"><button id="show-more" style="display:none">Show more</button></div>
</main>
<div class="modal-overlay" id="view-modal">
  <div class="modal">
    <div class="modal-header">
      <div><div class="modal-title" id="view-title"></div><div class="modal-sub" id="view-sub"></div></div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-back" id="view-back" style="display:none" onclick="goBack()">← Back</button>
        <button class="btn-close" onclick="closeModal('view-modal')">✕</button>
      </div>
    </div>
    <div class="modal-body" id="view-body"></div>
  </div>
</div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, collection, getDocs, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import { firebaseConfig } from "./firebase-config.js";

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const CACHE_KEY = 'neom_products_cache_v2';
const CACHE_TTL_MS = 6 * 60 * 60 * 1000; // 6 hours
const AI={'Gluten':'🌾','Tree nuts':'🌰','Peanuts':'🥜','Eggs':'🥚','Milk':'🥛','Fish':'🐟','Crustaceans':'🦐','Molluscs':'🦑','Celery':'🥬','Mustard':'🌼','Sesame':'🫘','Soya':'🫛','Sulphites':'⚗️','Lupin':'🌿'};
let DATA=[];
async function loadData(){
  const grid=document.getElementById('grid');
  const cached=localStorage.getItem(CACHE_KEY);
  let cachedParsed=null;
  if(cached){
    try{ cachedParsed=JSON.parse(cached); }catch(e){}
  }
  let useCache=false;
  if(cachedParsed && Date.now()-cachedParsed.ts<CACHE_TTL_MS){
    try{
      const metaSnap=await getDoc(doc(db,'meta','catalog'));
      const serverVersion=metaSnap.exists()?metaSnap.data().updatedAt?.toMillis?.():null;
      useCache = serverVersion!=null && cachedParsed.version===serverVersion;
    }catch(e){
      console.error('Catalog version check failed, forcing a fresh fetch',e);
      useCache=false;
    }
  }
  if(useCache){
    DATA=cachedParsed.items;indexData();render(true);return;
  }
  grid.innerHTML='<div class="empty"><div class="empty-icon">⏳</div><h3>Loading database…</h3></div>';
  try{
    const [snap,metaSnap]=await Promise.all([getDocs(collection(db,'products')),getDoc(doc(db,'meta','catalog'))]);
    DATA=snap.docs.map(d=>({id:d.id,...d.data()}));
    indexData();
    const version=metaSnap.exists()?metaSnap.data().updatedAt?.toMillis?.()??null:null;
    localStorage.setItem(CACHE_KEY,JSON.stringify({ts:Date.now(),version,items:DATA}));
  }catch(e){
    console.error('Failed to load products from Firestore',e);
    grid.innerHTML='<div class="empty"><div class="empty-icon">⚠️</div><h3>Could not load database</h3><p>Check your Firebase configuration and connection</p></div>';
    return;
  }
  render(true);
}

const PAGE=30;
let filtered=[],shown=0,curSource='all',curQuery='';

function norm(s){return s.toLowerCase().replace(/[^a-z0-9\s]/g,' ').replace(/\s+/g,' ').trim()}
function scoreM(name,q){
  const n=norm(name),qn=norm(q);
  if(n.startsWith(qn))return 3;if(n.includes(qn))return 2;
  const w=qn.split(' ').filter(Boolean),h=w.filter(x=>n.includes(x));
  return h.length===w.length?1:h.length>0?.5:0;
}

let DATA_BY_ID=new Map(),NAME_INDEX=new Map();
function indexData(){
  DATA_BY_ID=new Map();NAME_INDEX=new Map();
  DATA.forEach(rec=>{
    DATA_BY_ID.set(String(rec.id),rec);
    const k=norm(rec.name||'');
    if(!NAME_INDEX.has(k)) NAME_INDEX.set(k,[]);
    NAME_INDEX.get(k).push(rec);
  });
}
const QTY_RE=/^(.*?)\s*-\s*[\d.,\/]+\s*(?:g|kg|ml|l)\s*$/i;
function tokenScore(name,query){
  const nTokens=norm(name).split(' ').filter(Boolean),qTokens=norm(query).split(' ').filter(Boolean);
  if(qTokens.length<2) return 0;
  let matchedCount=0;
  for(const qt of qTokens){
    const found=nTokens.some(nt=>nt===qt||(Math.abs(nt.length-qt.length)<=2&&(nt.startsWith(qt)||qt.startsWith(nt))));
    if(found) matchedCount++;
  }
  if(matchedCount!==qTokens.length) return 0;
  const diff=Math.abs(nTokens.length-qTokens.length);
  if(diff>3) return 0;
  return 1+(1/(1+diff));
}
function matchIngredientLine(line){
  const m=line.match(QTY_RE);
  const base=(m?m[1]:line).trim();
  if(!base) return null;
  const exact=NAME_INDEX.get(norm(base));
  if(exact&&exact.length) return exact[0];
  let best=null,bestScore=0;
  DATA.forEach(rec=>{
    const s=tokenScore(rec.name,base);
    if(s>bestScore){bestScore=s;best=rec;}
  });
  return best;
}
function getFiltered(){
  let r=DATA;
  if(curSource!=='all') r=r.filter(x=>x.source===curSource);
  const q=curQuery.trim();
  if(q) r=r.map(x=>[x,scoreM(x.name,q)]).filter(([,s])=>s>0).sort(([,a],[,b])=>b-a).map(([x])=>x);
  return r;
}
function pills(list,cls){return(list||[]).map(a=>`<span class="ap ${cls}">${a}</span>`).join('')}
function buildCard(r,idx){
  const kcal=r.kcal!=null?parseFloat(r.kcal).toFixed(0):'—';
  const d=r.details||{};
  const meta=[d.brand&&'🏷️ '+d.brand,d.category].filter(Boolean).join(' · ')||(r.source==='recipes'?'Recipe':'Product');
  const c=r.contains||[],m=r.may_contain||[];
  let alHTML=c.length===0&&m.length===0?'<span class="safe-badge">No allergens</span>':'';
  if(c.length) alHTML+=`<div class="sec-label contains">Contains</div><div class="allergen-icons">${pills(c,'contains')}</div>`;
  if(m.length) alHTML+=`<div class="sec-label may">May Contain</div><div class="allergen-icons">${pills(m,'may')}</div>`;
  const diet=(r.diet||[]).map(dt=>`<span class="diet-tag">${dt}</span>`).join('');
  const hasD=d.ingredients||d.country||d.brand||d.description||d.notes||d.fat!=null||d.protein!=null||d.carbs!=null||d.method;
  return `<div class="card" onclick="openView(${idx})">
    <div class="card-top">
      <div class="card-title-area">
        <div class="recipe-name">${r.name}</div>
        <div class="recipe-meta">${meta}</div>
      </div>
      <div class="kcal-badge">${kcal}<small>kcal/100g</small></div>
    </div>
    <div>${alHTML}</div>
    ${diet?`<div class="diet-row">${diet}</div>`:''}
    ${hasD?`<div class="btn-details">Details →</div>`:''}
  </div>`;
}
function render(reset=true){
  if(reset){filtered=getFiltered();shown=0;}
  const grid=document.getElementById('grid');
  const si=shown,chunk=filtered.slice(shown,shown+PAGE);
  shown+=chunk.length;
  if(reset) grid.innerHTML='';
  grid.insertAdjacentHTML('beforeend',filtered.length===0
    ?'<div class="empty"><div class="empty-icon">🔍</div><h3>No results found</h3><p>Try a different search or filter</p></div>'
    :chunk.map((r,i)=>buildCard(r,si+i)).join(''));
  document.getElementById('result-count').textContent=filtered.length.toLocaleString();
  document.getElementById('total-count').textContent=DATA.length.toLocaleString();
  const btn=document.getElementById('show-more'),rem=filtered.length-shown;
  btn.style.display=rem>0?'inline-block':'none';
  if(rem>0) btn.textContent=`Show more (${rem.toLocaleString()} remaining)`;
}
function esc(t){return t?String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'):''}
function ingredientLineHTML(line){
  line=line.trim();
  if(!line) return '';
  const match=matchIngredientLine(line);
  if(!match) return `<div class="ing-line">${esc(line)}</div>`;
  const c=match.contains||[],m=match.may_contain||[];
  const tags=[...c.map(a=>`<span class="ap contains">${a}</span>`),
              ...m.map(a=>`<span class="ap may">${a}</span>`)].join('');
  return `<div class="ing-line linked" onclick="showDetailsById('${match.id}')">${esc(line)}${tags}</div>`;
}
let viewStack=[],currentRecord=null;
function showDetails(r){
  currentRecord=r;
  const d=r.details||{};
  document.getElementById('view-title').textContent=r.name;
  document.getElementById('view-sub').textContent=[d.brand,d.category].filter(Boolean).join(' · ');
  const kc=r.kcal!=null?parseFloat(r.kcal).toFixed(0):'—';
  const fat=d.fat!=null?d.fat+'g':'—',prot=d.protein!=null?d.protein+'g':'—',carb=d.carbs!=null?d.carbs+'g':'—';
  const c=r.contains||[],m=r.may_contain||[];
  const ap=[...c.map(a=>`<span class="ap contains" style="display:inline-flex;margin:2px">${a}</span>`),
            ...m.map(a=>`<span class="ap may" style="display:inline-flex;margin:2px">${a}</span>`)];
  let b='';
  b+=`<div class="detail-section"><div class="detail-label">Nutrition / 100g</div><div class="nut-grid">
    <div class="nut-cell"><div class="nut-val">${kc}</div><div class="nut-lbl">kcal</div></div>
    <div class="nut-cell"><div class="nut-val">${fat}</div><div class="nut-lbl">fat</div></div>
    <div class="nut-cell"><div class="nut-val">${prot}</div><div class="nut-lbl">prot</div></div>
    <div class="nut-cell"><div class="nut-val">${carb}</div><div class="nut-lbl">carb</div></div>
  </div></div>`;
  b+=`<div class="detail-section"><div class="detail-label">Allergens</div>${ap.length?`<div style="display:flex;flex-wrap:wrap;gap:3px">${ap.join('')}</div>`:'<span class="safe-badge">No allergens</span>'}</div>`;
  if(d.brand||d.country) b+=`<div class="detail-section"><div class="detail-label">Product Info</div><div class="detail-value">${[d.brand&&`Brand: ${esc(d.brand)}`,d.country&&`Country: ${esc(d.country)}`].filter(Boolean).join('  ·  ')}</div></div>`;
  if(r.diet?.length) b+=`<div class="detail-section"><div class="detail-label">Dietary</div><div style="display:flex;gap:4px;flex-wrap:wrap">${r.diet.map(dt=>`<span class="diet-tag">${dt}</span>`).join('')}</div></div>`;
  if(d.ingredients){
    const body=r.source==='recipes'
      ?d.ingredients.split('\n').map(ingredientLineHTML).join('')
      :esc(d.ingredients);
    b+=`<div class="detail-section"><div class="detail-label">🥕 Ingredients</div><div class="ing-box">${body}</div></div>`;
  }
  if(d.method) b+=`<div class="detail-section"><div class="detail-label">👨‍🍳 Method</div><div class="method-box">${esc(d.method)}</div></div>`;
  if(d.description) b+=`<div class="detail-section"><div class="detail-label">Description</div><div class="detail-value">${esc(d.description)}</div></div>`;
  if(d.notes) b+=`<div class="detail-section"><div class="detail-label">Notes</div><div class="detail-value">${esc(d.notes)}</div></div>`;
  document.getElementById('view-body').innerHTML=b;
  document.getElementById('view-back').style.display=viewStack.length?'inline-block':'none';
}
function openView(idx){
  viewStack=[];
  showDetails(filtered[idx]);
  document.getElementById('view-modal').classList.add('open');
  document.body.style.overflow='hidden';
}
function showDetailsById(id){
  const rec=DATA_BY_ID.get(String(id));
  if(!rec) return;
  if(currentRecord) viewStack.push(currentRecord);
  showDetails(rec);
  document.getElementById('view-body').scrollTop=0;
}
function goBack(){
  const prev=viewStack.pop();
  if(prev) showDetails(prev);
}
function closeModal(id){document.getElementById(id).classList.remove('open');document.body.style.overflow='';}
window.openView=openView;
window.closeModal=closeModal;
window.showDetailsById=showDetailsById;
window.goBack=goBack;
document.querySelectorAll('.modal-overlay').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModal(m.id);}));
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modal-overlay.open').forEach(m=>closeModal(m.id));});
let deb;
document.getElementById('search').addEventListener('input',e=>{clearTimeout(deb);deb=setTimeout(()=>{curQuery=e.target.value;render(true);},200);});
document.querySelectorAll('.tab[data-source]').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.tab[data-source]').forEach(x=>x.classList.remove('active'));
  b.classList.add('active');curSource=b.dataset.source;render(true);
}));
document.getElementById('show-more').addEventListener('click',()=>render(false));
function currentTheme(){
  return document.documentElement.getAttribute('data-theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
}
function applyThemeIcon(){
  document.getElementById('theme-toggle').textContent = currentTheme()==='dark' ? '☀️' : '🌙';
}
document.getElementById('theme-toggle').addEventListener('click', ()=>{
  const next = currentTheme()==='dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('nutriziz-theme', next);
  applyThemeIcon();
});
applyThemeIcon();
loadData();
</script>
</body>
</html>
